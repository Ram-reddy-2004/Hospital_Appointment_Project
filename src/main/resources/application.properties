# ==========================================================
# Hospital Appointment Scheduling & Telemedicine Management
# ==========================================================

spring.application.name=hospital-appointment-system
server.port=8080

# Postgres SQL Database Configuration

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/hospitaldb
spring.datasource.username=postgres
spring.datasource.password=root

#JPA / Hibernate Configuration

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------- Session ----------------
server.servlet.session.timeout=20m

# ---------------- Jackson (REST API JSON) ----------------
# Frontend is static HTML/CSS/JS calling this REST API directly (no Thymeleaf).
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd

# ---------------- Static resources ----------------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
